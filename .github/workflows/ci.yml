name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/agendrain
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - name: Cross compile without CGO
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            suffix=""
            if [ "${target%/*}" = windows ]; then suffix=".exe"; fi
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o dist/agendrain-${target%/*}-${target#*/}${suffix} ./cmd/agendrain
          done
          (cd dist && sha256sum agendrain-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: agendrain-${{ github.sha }}
          path: dist/
          retention-days: 14
