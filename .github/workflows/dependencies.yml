name: Refresh dependency manifests
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-manifests
          path: |
            go.mod
            go.sum
